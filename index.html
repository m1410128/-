<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>16マス計算機</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>16マス計算機</h1>
        <p>攻撃力と防御力を入力すると、基礎ダメージに16通りの倍率をかけて表示します。</p>
      </div>
      <div class="formula">(22 × 技威力 × 攻撃力 ÷ 防御力) ÷ 50 + 2</div>
    </header>

    <section class="inputs" aria-label="数値入力">
      <div class="input-stack">
        <label>
          攻撃側の攻撃力
          <input id="inputA" type="number" inputmode="decimal" step="any" placeholder="例: 100">
        </label>
        <label>
          技威力
          <input id="inputD" type="number" inputmode="decimal" step="any" placeholder="例: 0">
        </label>
      </div>
      <div class="input-stack">
        <label>
          防御側のHP
          <input id="inputC" type="number" inputmode="decimal" step="any" placeholder="例: 0">
        </label>
        <label>
          防御側の防御力
          <input id="inputB" type="number" inputmode="decimal" step="any" placeholder="例: 20">
        </label>
      </div>
    </section>

    <section class="summary" aria-live="polite">
      <p>基礎ダメージ</p>
      <strong id="baseResult">--</strong>
    </section>

    <div class="actions">
      <button id="calculateButton" type="button">ダメージ計算</button>
    </div>

    <section class="diff-panel" aria-label="Cから計算結果を引いた範囲">
      <div class="diff-head">
        <span>C - 計算結果</span>
        <span class="diff-values">
          <span id="resultRatio">--</span>
          <span id="diffRange">--</span>
        </span>
      </div>
      <div class="diff-track">
        <span id="diffPrimary" class="diff-segment primary"></span>
        <span id="diffSoft" class="diff-segment soft"></span>
      </div>
      <div class="diff-scale">
        <span>0</span>
        <span id="diffMax">C</span>
      </div>
    </section>

    <section id="resultGrid" class="grid" aria-label="16通りの計算結果"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
